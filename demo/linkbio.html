<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demonstração — Link na bio</title>
<style>
:root{--c:#6d28d9;--cd:#4c1d95;--bg:#f6f3ff;--card:#fff;--ink:#1c1530;--mute:#5b5470;--line:#ddd6fe}
[data-t=dark]{--bg:#120c1f;--card:#1d1530;--ink:#f1edfb;--mute:#b8aed0;--line:#3b2d5e;--c:#8b5cf6;--cd:#c4b5fd}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:16px;line-height:1.4}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.demo{background:#1c1530;color:#fff;text-align:center;font-size:12.5px;padding:6px 10px}
.wrap{max-width:460px;margin:0 auto;padding:28px 18px 40px;text-align:center}
.tools{display:flex;justify-content:space-between;margin-bottom:10px}
.tools button{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:18px}
.av{width:96px;height:96px;border-radius:50%;background:var(--c);color:#fff;font-size:34px;font-weight:800;display:grid;place-items:center;margin:0 auto 12px;border:4px solid var(--card);box-shadow:0 4px 14px rgba(28,21,48,.15)}
h1{font-size:22px;letter-spacing:-.4px}
.bio{color:var(--mute);margin:6px 0 22px;font-size:15px}
.links{display:grid;gap:12px}
.lk{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--c);color:var(--ink);text-decoration:none;font-weight:700;padding:15px 16px;border-radius:16px;min-height:56px;opacity:0;transform:translateY(10px);animation:in .4s forwards}
.lk.main{background:var(--c);color:#fff}
.lk svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lk span{flex:1;text-align:center;margin-right:34px}
@keyframes in{to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.lk{animation:none;opacity:1;transform:none}}
.soc{display:flex;justify-content:center;gap:18px;margin-top:28px}
.soc a{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--cd)}
.soc svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#1c1530;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
:focus-visible{outline:3px solid #c4b5fd;outline-offset:2px}
</style>
</head>
<body>
<div class="demo">Demonstração gerada com o prompt da Dev Marketing · perfil fictício</div>
<div class="wrap">
 <div class="tools"><button id="share" aria-label="Compartilhar esta página">⤴</button><button id="tema" aria-label="Alternar tema">🌙</button></div>
 <!-- Para usar sua foto: troque a div .av por <img class="av" src="sua-foto.jpg" alt="Seu nome"> -->
 <div class="av" aria-hidden="true" id="av"></div>
 <h1 id="nome"></h1><p class="bio" id="bio"></p>
 <div class="links" id="links"></div>
 <div class="soc" id="soc"></div>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
/* ===== Dados editáveis ===== */
const PERFIL={nome:'Studio Flor & Cia',bio:'Arranjos e buquês em Niterói. Entregamos no mesmo dia.'};
const ICONES={
 loja:'<path d="M3 9l1.500-5h15L21 9M3 9v11h18V9M3 9h18M9 20v-6h6v6"/>',zap:'<path d="M21 11.500a8.500 8.500 0 0 1-12.700 7.400L3 20l1.200-5A8.500 8.500 0 1 1 21 11.500z"/>',
 cardapio:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',mapa:'<path d="M12 21s-6-5.300-6-10a6 6 0 0 1 12 0c0 4.700-6 10-6 10z"/><circle cx="12" cy="11" r="2"/>',
 estrela:'<path d="M12 3l2.600 5.600 6 .700-4.400 4.200 1.200 6L12 16.600 6.600 19.500l1.200-6L3.400 9.300l6-.700z"/>'};
const LINKS=[
 {t:'Pedir pelo WhatsApp',u:'#demo',i:'zap',main:true},
 {t:'Catálogo de buquês',u:'#demo',i:'cardapio'},
 {t:'Loja online',u:'#demo',i:'loja'},
 {t:'Como chegar',u:'#demo',i:'mapa'},
 {t:'Avaliações no Google',u:'#demo',i:'estrela'}];
const REDES=[
 {n:'Instagram',u:'#demo',s:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.500" cy="6.500" r=".800" fill="currentColor"/>'},
 {n:'TikTok',u:'#demo',s:'<path d="M14 3v11.500a3.500 3.500 0 1 1-3.500-3.500M14 3a5 5 0 0 0 5 5"/>'},
 {n:'YouTube',u:'#demo',s:'<rect x="2.500" y="5.500" width="19" height="13" rx="4"/><path d="M10 9.500v5l4.500-2.500z" fill="currentColor"/>'}];
/* ===== Lógica ===== */
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
$('av').textContent=PERFIL.nome.split(/\s+/).filter(w=>/^[A-Za-zÀ-ÿ]/.test(w)).map(w=>w[0]).join('').slice(0,2).toUpperCase();
$('nome').textContent=PERFIL.nome;$('bio').textContent=PERFIL.bio;
$('links').innerHTML=LINKS.map((l,i)=>`<a class="lk${l.main?' main':''}" href="${esc(l.u)}" target="_blank" rel="noopener" style="animation-delay:${i*70}ms" aria-label="${esc(l.t)} (abre em nova aba)"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONES[l.i]||''}</svg><span>${esc(l.t)}</span></a>`).join('');
$('soc').innerHTML=REDES.map(r=>`<a href="${esc(r.u)}" target="_blank" rel="noopener" aria-label="${esc(r.n)} (abre em nova aba)"><svg viewBox="0 0 24 24" aria-hidden="true">${r.s}</svg></a>`).join('');
function toast(t){$('toast').textContent=t;$('toast').classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('on'),1800);}
$('share').onclick=()=>{try{navigator.clipboard.writeText(location.href).then(()=>toast('Link copiado'),()=>toast('Não foi possível copiar'));}catch(e){toast('Não foi possível copiar');}};
function tema(t){document.documentElement.dataset.t=t;$('tema').textContent=t==='dark'?'☀️':'🌙';try{localStorage.setItem('bio_tema',t);}catch(e){}}
$('tema').onclick=()=>tema(document.documentElement.dataset.t==='dark'?'':'dark');
try{tema(localStorage.getItem('bio_tema')||'');}catch(e){}
document.addEventListener('click',e=>{const a=e.target.closest('a[href="#demo"]');if(a){e.preventDefault();toast('Demonstração: link fictício');}});
</script>
</body>
</html>
