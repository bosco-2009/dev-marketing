<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demonstração — Loja virtual</title>
<style>
:root{--c:#6d28d9;--cd:#4c1d95;--bg:#f6f4fb;--card:#fff;--ink:#1c1530;--mute:#5b5470;--line:#e6e1f2;--soft:#ede9fe;--no:#b42318}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;padding-bottom:30px}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.demo{background:#1c1530;color:#fff;text-align:center;font-size:12.5px;padding:6px 10px}
header{position:sticky;top:0;z-index:5;background:var(--c);color:#fff;padding:10px 14px}
.hr{display:flex;align-items:center;gap:10px;max-width:720px;margin:0 auto}
.hr b{font-size:17px;white-space:nowrap}
.hr input{flex:1;min-width:0;border:0;border-radius:999px;height:42px;padding:0 14px;color:#1c1530;background:#fff}
.cartb{position:relative;width:44px;height:44px;border-radius:50%;flex:none;font-size:20px;color:#fff}
.cartb span{position:absolute;top:0;right:0;background:#fff;color:var(--c);font-size:11px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center}
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line);scrollbar-width:none}
.cats button{flex:none;padding:0 14px;min-height:44px;border-radius:999px;background:var(--bg);font-weight:600;font-size:14px}
.cats button[aria-pressed=true]{background:var(--c);color:#fff}
main{max-width:720px;margin:0 auto;padding:12px 14px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--mute);font-size:13.5px}
.bar button{min-height:44px;padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;color:var(--cd)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.p{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
.p>button:first-of-type{display:block;width:100%;text-align:left}
.p svg{display:block;width:100%;aspect-ratio:1}
.p div{padding:9px 10px 11px}
.p b{display:block;font-size:13.5px;font-weight:600}
.p strong{font-size:16px}
.fav{position:absolute;top:6px;right:6px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.92);font-size:18px;color:var(--c)}
.empty{grid-column:1/-1;text-align:center;padding:36px 16px;background:var(--card);border:1px dashed var(--line);border-radius:14px;color:var(--mute)}
.empty button{color:var(--c);font-weight:700;min-height:44px}
.scrim{position:fixed;inset:0;background:rgba(28,21,48,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
.scrim.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 16px 20px;max-height:92vh;overflow-y:auto}
.sheet h3{font-size:18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.x{width:44px;height:44px;border-radius:50%;background:var(--bg)}
.var{margin-top:12px}
.var small{font-weight:700;display:block;margin-bottom:6px}
.var div{display:flex;gap:8px;flex-wrap:wrap}
.var button{min-width:48px;min-height:44px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);font-weight:600}
.var button[aria-pressed=true]{border-color:var(--c);background:var(--soft);color:var(--cd)}
.qty{display:flex;align-items:center;gap:14px;margin:14px 0 4px}
.qty button,.ci button{width:44px;height:44px;border-radius:50%;background:var(--bg);font-size:18px;font-weight:700}
.pri{display:block;width:100%;background:var(--c);color:#fff;font-weight:700;padding:15px;border-radius:12px;margin-top:14px;min-height:48px}
.err{color:var(--no);font-size:13px;font-weight:600;margin-top:8px}
.ci{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.ci div{flex:1;min-width:0}.ci small{color:var(--mute);display:block}
.row{display:flex;justify-content:space-between;padding-top:10px;color:var(--mute)}
.row.t{color:var(--ink);font-weight:800;font-size:17px}
label{display:block;font-size:13px;font-weight:700;margin-top:12px}
label input,label select{display:block;width:100%;margin-top:6px;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-weight:400;font-size:16px;background:#fff}
pre{white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:12px;font:13px/1.5 ui-monospace,Menlo,monospace;margin-top:10px}
:focus-visible{outline:3px solid #c4b5fd;outline-offset:2px}
</style>
</head>
<body>
<div class="demo">Demonstração gerada com o prompt da Dev Marketing · loja fictícia</div>
<header><div class="hr"><b id="nome"></b><input id="q" type="search" placeholder="Buscar produtos" aria-label="Buscar produtos"><button class="cartb" id="openCart" aria-label="Abrir carrinho">🛒<span id="cn" hidden></span></button></div></header>
<nav class="cats" id="cats" aria-label="Categorias"></nav>
<main><div class="bar"><span id="count"></span><button id="openF">Filtros</button></div><div class="grid" id="grid"></div></main>
<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<script>
/* ===== Dados editáveis ===== */
const LOJA={nome:'Ateliê Exemplo',whatsapp:'5500000000000',frete:1500,freteGratisAcima:20000}; // valores em centavos
const PRODUTOS=[
 {id:1,nome:'Camiseta básica',cat:'Roupas',preco:5990,desc:'Algodão macio, modelagem reta.',vars:{Tamanho:['P','M','G','GG'],Cor:['Branca','Preta','Lilás']}},
 {id:2,nome:'Vestido midi',cat:'Roupas',preco:14990,desc:'Tecido leve, com bolsos.',vars:{Tamanho:['P','M','G']}},
 {id:3,nome:'Calça de linho',cat:'Roupas',preco:12990,desc:'Cintura alta e caimento solto.',vars:{Tamanho:['36','38','40','42']}},
 {id:4,nome:'Bolsa de lona',cat:'Acessórios',preco:7990,desc:'Alça longa e bolso interno.',vars:{Cor:['Crua','Preta']}},
 {id:5,nome:'Colar dourado',cat:'Acessórios',preco:4590,desc:'Banhado, com fecho regulável.'},
 {id:6,nome:'Lenço estampado',cat:'Acessórios',preco:3990,desc:'Seda sintética, 70 × 70 cm.'},
 {id:7,nome:'Sandália rasteira',cat:'Calçados',preco:9990,desc:'Tiras em couro sintético.',vars:{Número:['35','36','37','38','39']}},
 {id:8,nome:'Tênis branco',cat:'Calçados',preco:18990,desc:'Solado de borracha, cabedal lavável.',vars:{Número:['36','37','38','39','40']}}];
/* ===== Estado ===== */
const $=id=>document.getElementById(id);
const brl=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const ler=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},gravar=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const MAX=Math.max(...PRODUTOS.map(p=>p.preco));
const S={q:'',cat:'Todos',ord:'rel',max:MAX,favs:ler('loja_favs')||[],cart:ler('loja_cart')||[]}; // cart: {id,vars:{},qtd}
const COR=['#6d28d9','#4c1d95','#8b5cf6','#7c3aed'];
const capa=p=>`<svg viewBox="0 0 100 100" role="img" aria-label="${esc(p.nome)}"><rect width="100" height="100" fill="${COR[p.id%4]}"/><circle cx="78" cy="22" r="26" fill="#fff" opacity=".14"/><text x="10" y="88" font-family="system-ui,sans-serif" font-size="30" font-weight="800" fill="#fff">${p.nome.split(' ').filter(w=>w.length>2).map(w=>w[0]).join('').slice(0,2).toUpperCase()}</text></svg>`;
function lista(){
  const q=norm(S.q.trim());
  let r=PRODUTOS.filter(p=>(S.cat==='Todos'||p.cat===S.cat)&&p.preco<=S.max&&(!q||norm(p.nome+' '+p.desc+' '+p.cat).includes(q)));
  if(S.ord==='menor')r.sort((a,b)=>a.preco-b.preco);if(S.ord==='maior')r.sort((a,b)=>b.preco-a.preco);if(S.ord==='nome')r.sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
  return r;
}
function render(){
  $('cats').innerHTML=['Todos',...new Set(PRODUTOS.map(p=>p.cat))].map(c=>`<button data-cat="${c}" aria-pressed="${S.cat===c}">${c}</button>`).join('');
  const r=lista();$('count').textContent=r.length+(r.length===1?' produto':' produtos');
  $('grid').innerHTML=r.length?r.map(p=>`<div class="p"><button data-p="${p.id}">${capa(p)}<div><b>${esc(p.nome)}</b><strong>${brl(p.preco)}</strong></div></button><button class="fav" data-fav="${p.id}" aria-pressed="${S.favs.includes(p.id)}" aria-label="Favoritar ${esc(p.nome)}">${S.favs.includes(p.id)?'♥':'♡'}</button></div>`).join(''):
   '<div class="empty"><b>Nada encontrado</b><br>Tente outra busca ou remova os filtros.<br><button id="limpar">Limpar busca e filtros</button></div>';
  const n=S.cart.reduce((s,l)=>s+l.qtd,0);$('cn').hidden=!n;$('cn').textContent=n;
}
const tot=()=>{const sub=S.cart.reduce((s,l)=>s+PRODUTOS.find(p=>p.id===l.id).preco*l.qtd,0),frete=!sub||sub>=LOJA.freteGratisAcima?0:LOJA.frete;return {sub,frete,total:sub+frete};};
const vtxt=v=>Object.entries(v||{}).map(([k,x])=>k+': '+x).join(', ');
/* ===== Janelas ===== */
let sel=null,rolagem=0;
const abrir=h=>{rolagem=window.scrollY;$('sheet').innerHTML=h;$('scrim').classList.add('on');const x=$('sheet').querySelector('.x');if(x)x.focus();};
const fechar=()=>{$('scrim').classList.remove('on');window.scrollTo(0,rolagem);};
function produto(id){
  const p=PRODUTOS.find(x=>x.id===id);sel={id,vars:{},qtd:1};
  abrir(`<h3>${esc(p.nome)}<button class="x" data-x aria-label="Fechar">✕</button></h3><p style="color:var(--mute)">${esc(p.desc)}</p><strong style="font-size:22px;display:block;margin-top:6px">${brl(p.preco)}</strong>
   ${Object.entries(p.vars||{}).map(([k,ops])=>`<div class="var"><small>${k}</small><div>${ops.map(o=>`<button data-vk="${k}" data-vo="${o}" aria-pressed="false">${o}</button>`).join('')}</div></div>`).join('')}
   <div class="qty"><button data-q="-1" aria-label="Diminuir">−</button><b id="qn">1</b><button data-q="1" aria-label="Aumentar">+</button></div>
   <div class="err" id="erro" hidden></div><button class="pri" id="add">Adicionar ao carrinho</button>`);
}
function carrinho(){
  const t=tot();
  abrir(`<h3>Carrinho<button class="x" data-x aria-label="Fechar">✕</button></h3>`+(S.cart.length?S.cart.map((l,i)=>{const p=PRODUTOS.find(x=>x.id===l.id);return `<div class="ci"><div><b>${esc(p.nome)}</b><small>${esc(vtxt(l.vars))}${vtxt(l.vars)?' · ':''}${brl(p.preco*l.qtd)}</small></div><button data-c="${i}" data-d="-1" aria-label="Diminuir">−</button><b>${l.qtd}</b><button data-c="${i}" data-d="1" aria-label="Aumentar">+</button></div>`;}).join('')+
   `<div class="row"><span>Subtotal</span><span>${brl(t.sub)}</span></div><div class="row"><span>Frete</span><span>${t.frete?brl(t.frete):'Grátis'}</span></div><div class="row t"><span>Total</span><span>${brl(t.total)}</span></div>
    <label>Seu nome<input id="fn" autocomplete="name"></label><label>Endereço de entrega<input id="fe" autocomplete="street-address"></label>
    <label>Pagamento<select id="fp"><option>Pix</option><option>Cartão na entrega</option><option>Dinheiro</option></select></label>
    <div class="err" id="erro" hidden></div><button class="pri" id="enviar">Enviar pedido pelo WhatsApp</button>`:'<p style="color:var(--mute);padding:16px 0">Seu carrinho está vazio.</p>'));
}
function filtros(){
  abrir(`<h3>Filtros<button class="x" data-x aria-label="Fechar">✕</button></h3>
   <label>Ordenar por<select id="ford"><option value="rel">Mais relevantes</option><option value="menor">Menor preço</option><option value="maior">Maior preço</option><option value="nome">Nome</option></select></label>
   <label>Preço máximo: <span id="fmv">${brl(S.max)}</span><input id="fmax" type="range" min="${Math.min(...PRODUTOS.map(p=>p.preco))}" max="${MAX}" step="100" value="${S.max}" style="padding:0;border:0"></label>
   <button class="pri" data-x>Ver produtos</button>`);$('ford').value=S.ord;
}
document.addEventListener('click',e=>{
  if(e.target===$('scrim'))return fechar();
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.cat){S.cat=d.cat;render();}
  else if(d.fav){const id=+d.fav;S.favs=S.favs.includes(id)?S.favs.filter(x=>x!==id):[...S.favs,id];gravar('loja_favs',S.favs);render();}
  else if(d.p)produto(+d.p);
  else if('x' in d)fechar();
  else if(d.vk){sel.vars[d.vk]=d.vo;document.querySelectorAll(`[data-vk="${d.vk}"]`).forEach(x=>x.setAttribute('aria-pressed',x===b));}
  else if(d.q){sel.qtd=Math.max(1,sel.qtd+ +d.q);$('qn').textContent=sel.qtd;}
  else if(b.id==='add'){
    const p=PRODUTOS.find(x=>x.id===sel.id),falta=Object.keys(p.vars||{}).find(k=>!sel.vars[k]);
    if(falta){$('erro').hidden=false;$('erro').textContent='Escolha uma opção de '+falta.toLowerCase()+'.';return;}
    const ig=S.cart.find(l=>l.id===sel.id&&JSON.stringify(l.vars)===JSON.stringify(sel.vars));
    if(ig)ig.qtd+=sel.qtd;else S.cart.push(sel);
    gravar('loja_cart',S.cart);fechar();render();
  }
  else if(b.id==='openCart')carrinho();
  else if(d.c){const l=S.cart[+d.c];l.qtd+= +d.d;if(l.qtd<1)S.cart.splice(+d.c,1);gravar('loja_cart',S.cart);const n=$('fn')&&$('fn').value,en=$('fe')&&$('fe').value;carrinho();if($('fn')){$('fn').value=n||'';$('fe').value=en||'';}render();}
  else if(b.id==='openF')filtros();
  else if(b.id==='limpar'){S.q='';$('q').value='';S.cat='Todos';S.max=MAX;S.ord='rel';render();}
  else if(b.id==='enviar'){
    const n=$('fn').value.trim(),en=$('fe').value.trim();
    if(!n||!en){$('erro').hidden=false;$('erro').textContent=!n?'Informe seu nome.':'Informe o endereço de entrega.';return;}
    const t=tot(),msg='*Novo pedido — '+LOJA.nome+'*\n\n'+S.cart.map(l=>{const p=PRODUTOS.find(x=>x.id===l.id);return l.qtd+'x '+p.nome+(vtxt(l.vars)?' ('+vtxt(l.vars)+')':'')+' — '+brl(p.preco*l.qtd);}).join('\n')+'\n\nSubtotal: '+brl(t.sub)+'\nFrete: '+(t.frete?brl(t.frete):'grátis')+'\n*Total: '+brl(t.total)+'*\n\nNome: '+n+'\nEndereço: '+en+'\nPagamento: '+$('fp').value;
    if(LOJA.whatsapp!=='5500000000000')window.open('https://wa.me/'+LOJA.whatsapp+'?text='+encodeURIComponent(msg),'_blank','noopener');
    abrir(`<h3>Pedido pronto<button class="x" data-x aria-label="Fechar">✕</button></h3><p style="color:var(--mute)">Demonstração: esta é a mensagem que chegaria no WhatsApp da loja.</p><pre>${esc(msg)}</pre>`);
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value;render();}
  if(e.target.id==='fmax'){S.max=+e.target.value;$('fmv').textContent=brl(S.max);render();}
});
document.addEventListener('change',e=>{if(e.target.id==='ford'){S.ord=e.target.value;render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')fechar();});
$('nome').textContent=LOJA.nome;render();
</script>
</body>
</html>
