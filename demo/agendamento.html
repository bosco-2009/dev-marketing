<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demonstração — Agendamento</title>
<style>
:root{--c:#6d28d9;--cd:#4c1d95;--bg:#f6f4fb;--card:#fff;--ink:#1c1530;--mute:#5b5470;--line:#e6e1f2;--soft:#ede9fe;--no:#b42318}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.demo{background:#1c1530;color:#fff;text-align:center;font-size:12.5px;padding:6px 10px}
header{background:var(--c);color:#fff;padding:16px}
header div{max-width:560px;margin:0 auto}
header h1{font-size:20px}header p{font-size:13.5px;opacity:.9}
main{max-width:560px;margin:0 auto;padding:14px}
.prog{display:flex;gap:6px;margin-bottom:6px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--c)}
.step{display:flex;align-items:center;gap:8px;margin-bottom:12px;min-height:44px}
.step button{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:18px}
.step button[hidden]{display:none}
.step h2{font-size:17px}
.step small{color:var(--mute);display:block;font-weight:400;font-size:12.5px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;min-height:64px}
.opt small{color:var(--mute);display:block}
.opt strong{white-space:nowrap}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.days button{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 2px;min-height:58px;font-size:12px;color:var(--mute)}
.days button b{display:block;font-size:17px;color:var(--ink)}
.days button:disabled{opacity:.35;cursor:not-allowed}
.days button[aria-pressed=true],.slots button[aria-pressed=true]{border-color:var(--c);background:var(--soft)}
h3{font-size:15px;margin:16px 0 8px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slots button{background:var(--card);border:1.5px solid var(--line);border-radius:10px;min-height:46px;font-weight:700}
.slots button:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
label{display:block;font-size:13px;font-weight:700;margin-top:12px}
label input{display:block;width:100%;margin-top:6px;border:1.5px solid var(--line);border-radius:10px;padding:12px;font-weight:400;font-size:16px;background:#fff}
.sum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:5px 0}
.sum span{color:var(--mute)}
.pri{display:block;width:100%;background:var(--c);color:#fff;font-weight:700;padding:15px;border-radius:12px;margin-top:16px;min-height:48px}
.pri:disabled{background:#cfc8e0}
.err{color:var(--no);font-size:13px;font-weight:600;margin-top:8px}
.done{text-align:center;padding:10px 0}
.done h2{font-size:20px;margin:8px 0}
.done p{color:var(--mute)}
pre{white-space:pre-wrap;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font:13px/1.5 ui-monospace,Menlo,monospace;margin-top:12px}
:focus-visible{outline:3px solid #c4b5fd;outline-offset:2px}
</style>
</head>
<body>
<div class="demo">Demonstração gerada com o prompt da Dev Marketing · estabelecimento fictício</div>
<header><div><h1 id="nome"></h1><p id="end"></p></div></header>
<main id="main"></main>
<script>
/* ===== Dados editáveis ===== */
const CASA={nome:'Salão Exemplo',endereco:'Rua das Flores, 100 · Centro',whatsapp:'5500000000000'};
// funcionamento por dia da semana (0 = domingo): [abre, fecha] em horas; null = fechado
const FUNC={0:null,1:null,2:[9,19],3:[9,19],4:[9,19],5:[9,20],6:[9,16]};
const ALMOCO=[12,13]; // null se não houver
const SERVICOS=[{id:'corte',nome:'Corte feminino',dur:60,preco:8000},{id:'escova',nome:'Escova',dur:30,preco:5000},{id:'cor',nome:'Coloração',dur:120,preco:18000},{id:'mao',nome:'Manicure',dur:30,preco:3500}];
const PROS=[{id:'bia',nome:'Bia',serv:['corte','escova','cor']},{id:'lu',nome:'Lu',serv:['corte','escova']},{id:'rita',nome:'Rita',serv:['mao']}];
// horários ocupados: data (aaaa-mm-dd), hora (hh:mm), duração em minutos, profissional.
// Na demonstração eles são criados a partir de hoje; no seu site, liste as datas reais.
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const emDias=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d);};
const OCUPADOS=[1,2,3,4,5,6,7].flatMap(n=>[{data:emDias(n),hora:'10:00',dur:60,pro:'bia'},{data:emDias(n),hora:'14:30',dur:90,pro:'lu'},{data:emDias(n),hora:'09:00',dur:60,pro:'rita'}]);
/* ===== Lógica ===== */
const $=id=>document.getElementById(id);
const brl=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'),min=t=>+t.slice(0,2)*60+ +t.slice(3);
const S={passo:1,serv:null,pro:null,data:null,hora:null,proFinal:null,nome:'',tel:''};
const serv=()=>SERVICOS.find(s=>s.id===S.serv),prosDoServ=()=>PROS.filter(p=>p.serv.includes(S.serv));
// o profissional está livre em [ini, ini+dur)?
function livre(pro,data,ini,dur){
  const f=FUNC[new Date(data+'T12:00').getDay()];if(!f)return false;
  if(ini<f[0]*60||ini+dur>f[1]*60)return false;
  if(ALMOCO&&ini<ALMOCO[1]*60&&ini+dur>ALMOCO[0]*60)return false;
  if(data===iso(new Date())){const a=new Date();if(ini<=a.getHours()*60+a.getMinutes())return false;}
  return !OCUPADOS.some(o=>o.pro===pro&&o.data===data&&ini<min(o.hora)+o.dur&&ini+dur>min(o.hora));
}
function horarios(data){
  const f=FUNC[new Date(data+'T12:00').getDay()];if(!f)return [];
  const cand=S.pro==='qualquer'?prosDoServ().map(p=>p.id):[S.pro],out=[];
  for(let t=f[0]*60;t+serv().dur<=f[1]*60;t+=30){const p=cand.find(c=>livre(c,data,t,serv().dur));out.push({t,pro:p||null});}
  return out;
}
function render(){
  const T={1:['Escolha o serviço',''],2:['Escolha o profissional',serv()&&serv().nome],3:['Escolha o dia e o horário',serv()&&serv().nome+' · '+serv().dur+' min'],4:['Seus dados','Revise e confirme']};
  let h=S.passo<5?`<div class="prog">${[1,2,3,4].map(i=>`<i class="${i<=S.passo?'on':''}"></i>`).join('')}</div><div class="step"><button id="voltar" aria-label="Voltar" ${S.passo===1?'hidden':''}>←</button><h2>${T[S.passo][0]}<small>Passo ${S.passo} de 4${T[S.passo][1]?' · '+esc(T[S.passo][1]):''}</small></h2></div>`:'';
  if(S.passo===1)h+=SERVICOS.map(s=>`<button class="opt" data-serv="${s.id}"><span><b>${esc(s.nome)}</b><small>${s.dur} minutos</small></span><strong>${brl(s.preco)}</strong></button>`).join('');
  if(S.passo===2)h+=(prosDoServ().length>1?`<button class="opt" data-pro="qualquer"><span><b>Sem preferência</b><small>Primeiro profissional disponível</small></span></button>`:'')+prosDoServ().map(p=>`<button class="opt" data-pro="${p.id}"><span><b>${esc(p.nome)}</b></span></button>`).join('');
  if(S.passo===3){
    h+='<div class="days">'+Array.from({length:30},(_,i)=>{const d=new Date();d.setDate(d.getDate()+i);const k=iso(d),ok=horarios(k).some(x=>x.pro);
      return `<button data-dia="${k}" ${ok?'':'disabled'} aria-pressed="${S.data===k}" aria-label="${d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}${ok?'':' (sem horários)'}">${d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')}<b>${d.getDate()}</b>${d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')}</button>`;}).join('')+'</div>';
    if(S.data)h+=`<h3>Horários em ${new Date(S.data+'T12:00').toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</h3><div class="slots">${horarios(S.data).map(x=>`<button data-hora="${x.t}" data-p="${x.pro||''}" ${x.pro?'':'disabled'} aria-pressed="${S.hora===x.t}">${hm(x.t)}</button>`).join('')}</div>`;
    h+=`<button class="pri" id="avancar" ${S.hora===null?'disabled':''}>Continuar</button>`;
  }
  if(S.passo===4){const p=PROS.find(x=>x.id===S.proFinal);
    h+=`<div class="sum"><div><span>Serviço</span><b>${esc(serv().nome)}</b></div><div><span>Profissional</span><b>${esc(p.nome)}</b></div><div><span>Dia</span><b>${new Date(S.data+'T12:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'})}</b></div><div><span>Horário</span><b>${hm(S.hora)} às ${hm(S.hora+serv().dur)}</b></div><div><span>Valor</span><b>${brl(serv().preco)}</b></div></div>
     <label>Seu nome<input id="fn" autocomplete="name" value="${esc(S.nome)}"></label><label>Seu telefone<input id="ft" type="tel" inputmode="numeric" autocomplete="tel" placeholder="(21) 99999-9999" value="${esc(S.tel)}"></label>
     <div class="err" id="erro" hidden></div><button class="pri" id="confirmar">Confirmar pelo WhatsApp</button>`;}
  if(S.passo===5)h+=`<div class="done"><div style="font-size:44px">🕒</div><h2>Pedido de agendamento enviado</h2><p>O horário só está garantido depois que o ${esc(CASA.nome)} confirmar pelo WhatsApp.</p><p style="margin-top:8px;font-size:13px">Demonstração: esta é a mensagem que chegaria ao estabelecimento.</p><pre>${esc(S.msg)}</pre><button class="pri" id="novo">Fazer outro agendamento</button></div>`;
  $('main').innerHTML=h;window.scrollTo(0,0);
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.serv){S.serv=d.serv;S.pro=S.data=S.hora=null;const ps=prosDoServ();if(ps.length===1){S.pro=ps[0].id;S.passo=3;}else S.passo=2;}
  else if(d.pro){S.pro=d.pro;S.data=S.hora=null;S.passo=3;}
  else if(d.dia){S.data=d.dia;S.hora=null;render();document.querySelector('.slots')&&document.querySelector('h3').scrollIntoView({block:'start'});return;}
  else if(d.hora){S.hora=+d.hora;S.proFinal=d.p;document.querySelectorAll('[data-hora]').forEach(x=>x.setAttribute('aria-pressed',x===b));$('avancar').disabled=false;return;}
  else if(b.id==='avancar')S.passo=4;
  else if(b.id==='voltar'){if(S.passo===4){S.nome=$('fn').value;S.tel=$('ft').value;}S.passo=S.passo===3&&prosDoServ().length===1?1:S.passo-1;}
  else if(b.id==='confirmar'){
    S.nome=$('fn').value.trim();S.tel=$('ft').value;const dg=S.tel.replace(/\D/g,'');
    const er=S.nome.length<2?'Informe seu nome.':dg.length<10?'Informe o telefone com DDD.':!livre(S.proFinal,S.data,S.hora,serv().dur)?'Esse horário acabou de passar. Volte e escolha outro.':'';
    if(er){$('erro').hidden=false;$('erro').textContent=er;return;}
    S.msg='*Pedido de agendamento — '+CASA.nome+'*\n\nServiço: '+serv().nome+' ('+serv().dur+' min)\nProfissional: '+PROS.find(x=>x.id===S.proFinal).nome+'\nDia: '+new Date(S.data+'T12:00').toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'\nHorário: '+hm(S.hora)+'\nValor: '+brl(serv().preco)+'\n\nNome: '+S.nome+'\nTelefone: '+S.tel;
    if(CASA.whatsapp!=='5500000000000')window.open('https://wa.me/'+CASA.whatsapp+'?text='+encodeURIComponent(S.msg),'_blank','noopener');
    S.passo=5;
  }
  else if(b.id==='novo'){Object.assign(S,{passo:1,serv:null,pro:null,data:null,hora:null});}
  else return;render();});
document.addEventListener('input',e=>{if(e.target.id==='ft'){let d=e.target.value.replace(/\D/g,'').slice(0,11),v=d;if(d.length>2)v='('+d.slice(0,2)+') '+d.slice(2);if(d.length>7)v='('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7);e.target.value=v;}});
$('nome').textContent=CASA.nome;$('end').textContent=CASA.endereco;render();
</script>
</body>
</html>
