<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aurora Moda — loja de demonstração</title>
<meta name="description" content="Loja virtual de moda de demonstração criada pela Dev Marketing.">
<meta name="theme-color" content="#2a2420">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ac:#a8502f; --ac-d:#7e3a20; --ink:#2a2420; --mute:#6f655d; --line:#e9e1d6;
  --bg:#faf7f2; --card:#fff; --sand:#f1e9de; --ok:#2f7a4f; --no:#b42335; --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid #e4b49f;outline-offset:2px}
[hidden]{display:none!important}
.serif{font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:-.3px}
.wrap{max-width:720px;margin:0 auto}

/* faixa demo */
.demo{background:#1d1714;color:#f4ebe2;font-size:12.5px;padding:8px 14px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;text-align:center}
.demo a{background:#f4ebe2;color:#1d1714;font-weight:700;padding:4px 10px;border-radius:999px;text-decoration:none;white-space:nowrap}

/* topo */
.top{position:sticky;top:0;z-index:20;background:rgba(250,247,242,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:6px;padding:10px 12px}
.marca{flex:1;text-align:center;font-size:23px}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none}
.ib svg{width:23px;height:23px}
.cnt{position:absolute;top:3px;right:2px;background:var(--ac);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.cnt.pula{animation:pula .45s}
@keyframes pula{50%{transform:scale(1.35)}}
.busca{padding:0 12px 10px}
.busca input{width:100%;height:42px;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:0 16px;outline:0}
.busca input:focus{border-color:var(--ac)}

/* destaque */
.hero{margin:14px 12px 0;border-radius:22px;overflow:hidden;position:relative;background:linear-gradient(135deg,#efe3d3,#e2c9b0 55%,#cfa486);min-height:210px;padding:24px 20px;display:flex;flex-direction:column;justify-content:flex-end}
.hero small{font-size:12px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--ac-d)}
.hero h1{font-size:34px;line-height:1.05;margin:6px 0 6px;max-width:11ch}
.hero p{color:#5a4a3f;max-width:21ch;font-size:14px}
.hero button{margin-top:14px;align-self:flex-start;background:var(--ink);color:#fff;font-weight:700;padding:11px 18px;border-radius:999px;font-size:14px}
.hero svg{position:absolute;right:-6px;top:10px;width:150px;height:190px;opacity:.95}
.benef{display:flex;gap:8px;overflow-x:auto;padding:12px;scrollbar-width:none}
.benef::-webkit-scrollbar{display:none}
.benef span{flex:none;font-size:12.5px;font-weight:600;background:var(--card);border:1px solid var(--line);padding:7px 12px;border-radius:999px;color:#4a3f37}

/* filtros */
.filtros{display:flex;gap:8px;overflow-x:auto;padding:4px 12px 10px;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.barra{display:flex;align-items:center;justify-content:space-between;padding:0 14px 10px;font-size:13px;color:var(--mute)}
.barra select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 8px;font-size:13px}

/* vitrine */
.grade{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 12px 24px}
@media(min-width:600px){.grade{grid-template-columns:repeat(3,1fr)}}
.prod{background:var(--card);border-radius:var(--r);overflow:hidden;text-align:left;border:1px solid var(--line);display:flex;flex-direction:column}
.foto{aspect-ratio:4/5;display:grid;place-items:center;position:relative}
.foto svg{width:78%;height:86%}
.selo{position:absolute;left:8px;top:8px;background:var(--card);font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.selo.esg{background:#2a2420;color:#fff}
.info{padding:10px 11px 12px}
.info .n{font-weight:600;font-size:14px;line-height:1.25}
.info .p{font-weight:700;margin-top:4px}
.info .px{font-size:12px;color:var(--ok);font-weight:600}
.bolinhas{display:flex;gap:4px;margin-top:7px}
.bolinhas i{width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.vazio{text-align:center;color:var(--mute);padding:30px 14px}

/* rodapé */
footer{border-top:1px solid var(--line);padding:24px 16px calc(96px + env(safe-area-inset-bottom));text-align:center;color:var(--mute);font-size:13px}
footer .marca{font-size:20px;color:var(--ink);display:block;margin-bottom:6px}
footer a{font-weight:600}
.credito{margin-top:14px;font-size:12px}
.zap{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:15;width:56px;height:56px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.2)}
.zap svg{width:30px;height:30px}

/* janelas */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(30,22,18,.5)}
.sheet-box{position:relative;width:100%;max-width:560px;max-height:94vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom));animation:sobe .24s ease-out}
@keyframes sobe{from{transform:translateY(40px);opacity:.3}}
.sh-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--bg)}
.sh-top h2{font-size:20px}
.x{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:22px}
.det-foto{aspect-ratio:4/4.4;display:grid;place-items:center;margin:0 14px;border-radius:var(--r);position:relative}
.det-foto svg{width:70%;height:86%}
.compart{position:absolute;right:10px;top:10px;background:var(--card);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:700}
.det{padding:16px}
.det h3{font-size:24px;line-height:1.15}
.preco{font-size:22px;font-weight:700;margin-top:6px}
.preco small{display:block;font-size:13px;color:var(--ok);font-weight:600}
.desc{color:var(--mute);margin-top:10px;font-size:14.5px}
.rot{font-weight:700;font-size:14px;margin:18px 0 8px;display:flex;justify-content:space-between;align-items:center}
.rot span{font-weight:500;color:var(--mute)}
.cores{display:flex;gap:10px;flex-wrap:wrap}
.cor{width:38px;height:38px;border-radius:50%;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
.cor[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.tams{display:flex;gap:8px;flex-wrap:wrap}
.tam{min-width:48px;height:44px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600}
.tam[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tam:disabled{color:#b9b0a7;text-decoration:line-through;background:#f3efe9;cursor:not-allowed}
.aviso-est{font-size:13px;color:var(--ac-d);margin-top:8px;min-height:18px;font-weight:600}
.link{color:var(--ac-d);font-weight:700;font-size:13.5px;text-decoration:underline}
.medidas{margin-top:10px;width:100%;border-collapse:collapse;font-size:13.5px;background:var(--card);border-radius:12px;overflow:hidden}
.medidas th,.medidas td{padding:8px;border-bottom:1px solid var(--line);text-align:center}
.medidas th{background:var(--sand)}
.qtd{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--card);height:48px;flex:none}
.qtd button{width:42px;height:100%;font-size:20px}
.qtd b{min-width:26px;text-align:center}
.acoes{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;min-height:50px;border-radius:14px;background:var(--ink);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;padding:0 14px}
.btn.claro{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ac{background:var(--ac)}
.btn.verde{background:#25d366;color:#0b3d22}
.btn:disabled{opacity:.5}

/* sacola */
.it{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin:0 14px 10px}
.it .mini{width:70px;height:84px;border-radius:12px;display:grid;place-items:center;flex:none}
.it .mini svg{width:80%;height:88%}
.it .meio{flex:1;min-width:0}
.it .n{font-weight:600;font-size:14px}
.it .v{font-size:12.5px;color:var(--mute)}
.it .lin{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.it .qtd{height:36px}
.it .qtd button{width:34px;font-size:17px}
.rm{font-size:12.5px;color:var(--no);font-weight:600}
.tot{margin:6px 14px 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tot div{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}
.tot .g{font-weight:700;font-size:16px;border-top:1px solid var(--line);margin-top:6px;padding-top:9px}
.tot .pix{color:var(--ok);font-weight:600}
.form{padding:4px 14px 0}
.f{display:block;margin-top:12px}
.f>span{display:block;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:5px}
.f input,.f select{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--card);outline:0;font-size:16px}
.f input:focus,.f select:focus{border-color:var(--ac)}
.opc{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.opc label{position:relative}
.opc input{position:absolute;opacity:0}
.opc span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-weight:600;font-size:13.5px;padding:4px}
.opc input:checked+span{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opc input:focus-visible+span{outline:3px solid #e4b49f}
.erro{color:var(--no);font-size:13.5px;font-weight:600;margin:10px 14px 0;min-height:1em}
.pad{padding:0 14px}

/* pedido demo */
.balao{background:#dcf8c6;border-radius:14px 14px 4px 14px;padding:12px 14px;margin:10px 14px;font-size:13.5px;white-space:pre-wrap;box-shadow:0 1px 1px rgba(0,0,0,.08);color:#111}
.zapbg{background:#ece5dd;border-radius:var(--r);margin:0 14px;padding:4px 0}
.explica{padding:14px;color:var(--mute);font-size:14.5px}
.explica b{color:var(--ink)}

#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="brilho" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".12"/></linearGradient>

  </div>
  <div class="busca wrap" id="busca-box" hidden><input id="busca" type="search" placeholder="Buscar peças" aria-label="Buscar peças"></div>
</header>

<main class="wrap">
  <section class="hero" id="hero"></section>
  <div class="benef" id="benef"></div>
  <div class="filtros" id="filtros" role="group" aria-label="Categorias"></div>
  <div class="barra"><span id="qtd-res"></span>
    <select id="ordem" aria-label="Ordenar"><option value="rel">Destaques</option><option value="menor">Menor preço</option><option value="maior">Maior preço</option><option value="novo">Novidades</option></select>

  <section class="grade" id="grade"></section>
</main>

<footer id="rodape"></footer>
<a class="zap" id="zap" target="_blank" rel="noopener" aria-label="Falar no WhatsApp"><svg viewBox="0 0 32 32" fill="#fff"><path d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3zm0 23.6c-2 0-4-.6-5.7-1.6l-.4-.2-3.9 1 1-3.8-.3-.4A10.6 10.6 0 1 1 16 26.6zm5.8-7.9c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2l-1 1.2c-.2.2-.4.2-.7.1a8.7 8.7 0 0 1-4.3-3.8c-.3-.5.3-.5.9-1.6.1-.2 0-.4 0-.5l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8 0 1.6 1.2 3.2 1.4 3.4.2.2 2.3 3.6 5.7 5 2.1.9 3 1 4 .8.7-.1 1.9-.8 2.2-1.5.3-.8.3-1.4.2-1.5-.1-.1-.3-.2-.6-.3z"/></svg></a>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-bg" data-act="fechar"></div>
  <div class="sheet-box" role="dialog" aria-modal="true" aria-labelledby="sh-t">
    <div class="sh-top"><h2 class="serif" id="sh-t"></h2><button class="x" data-act="fechar" aria-label="Fechar">×</button></div>
    <div id="sh-c"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

  { id:11, nome:'Macacão Longo', cat:'macacoes', tipo:'macacao', preco:199.90, tams:['P','M','G'], medida:'letras',
    cores:[['Terracota','#b5573a'],['Preto','#2b2826']],
    estoque:{ 'Terracota':[1,2,2], 'Preto':[0,0,0] },
    desc:'Alças finas, cintura marcada e pernas amplas.' },
  { id:12, nome:'Saia Curta Couro Eco', cat:'saias', tipo:'saia', preco:119.90, tams:['P','M','G'], medida:'letras',
    cores:[['Preto','#2b2826'],['Chocolate','#4b3326']],
    estoque:{ 'Preto':[3,4,2], 'Chocolate':[2,1,0] },
    desc:'Couro ecológico com forro e zíper lateral invisível.' }
];
/* ========================= fim da configuração ========================= */

const FORMAS = {
  vestido:'M82 30 L90 30 Q100 52 110 30 L118 30 L122 92 Q120 104 126 112 L162 214 Q100 228 38 214 L74 112 Q80 104 78 92 Z',
  blusa:'M70 46 L88 38 Q100 52 112 38 L130 46 L162 74 L146 94 L132 84 L134 196 L66 196 L68 84 L54 94 L38 74 Z',
  camisa:'M72 40 L90 32 L100 48 L110 32 L128 40 L150 60 L170 168 L152 172 L134 92 L136 204 L64 204 L66 92 L48 172 L30 168 L50 60 Z',
  cropped:'M72 70 L90 62 Q100 74 110 62 L128 70 L156 92 L144 108 L132 100 L132 152 L68 152 L68 100 L56 108 L44 92 Z',
  calca:'M64 34 L136 34 L140 52 L150 214 L112 214 L100 92 L88 214 L50 214 L60 52 Z',
  saia:'M68 56 L132 56 L134 72 L166 204 Q100 218 34 204 L66 72 Z',
  short:'M62 64 L138 64 L141 78 L150 150 L110 154 L100 112 L90 154 L50 150 L59 78 Z',
  jaqueta:'M72 40 L90 32 L100 50 L110 32 L128 40 L150 60 L170 168 L152 172 L134 92 L136 196 L64 196 L66 92 L48 172 L30 168 L50 60 Z',
  macacao:'M80 30 L90 30 L95 78 L105 78 L110 30 L120 30 L126 98 L144 214 L110 214 L100 134 L90 214 L56 214 L74 98 Z'
};
const DETALHES = {
  camisa:'M100 48 L100 204 M90 32 L100 48 L110 32',
  jaqueta:'M100 50 L100 196 M90 32 L100 50 L110 32 M66 120 L134 120',
  calca:'M60 52 L140 52',
  saia:'M66 72 L134 72',
  short:'M59 78 L141 78',
  macacao:'M76 98 L124 98',
  vestido:'M78 92 Q100 98 122 92'
};

function tom(hex, f){ // clareia a cor para o fundo da foto
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const m = c => Math.round(c + (255 - c) * f);
  return `rgb(${m(r)},${m(g)},${m(b)})`;
}
function peca(tipo, cor){
  const d = FORMAS[tipo] || FORMAS.blusa, det = DETALHES[tipo];
  return `<svg viewBox="0 0 200 240" aria-hidden="true">
    <path d="M100 18 q-8 0 -8 7" fill="none" stroke="#8a7d72" stroke-width="3" stroke-linecap="round"/>
    <path d="${d}" fill="${cor}" stroke="rgba(0,0,0,.18)" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="${d}" fill="url(#brilho)"/>
    ${det ? `<path d="${det}" fill="none" stroke="rgba(0,0,0,.2)" stroke-width="1.6" stroke-linecap="round"/>` : ''}
  </svg>`;
}

/* ===== estado ===== */
const S = { cat:'todos', busca:'', ordem:'rel', sacola:[], sel:null };
const CHAVE = 'sacola:' + LOJA.nome;
try { S.sacola = JSON.parse(localStorage.getItem(CHAVE)) || []; } catch(e){}
function guardar(){ try { localStorage.setItem(CHAVE, JSON.stringify(S.sacola)); } catch(e){} }

const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const brl = n => Number(n).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
const prod = id => PRODUTOS.find(p => p.id === Number(id));
const estoqueDe = (p, cor, tam) => (p.estoque[cor] || [])[p.tams.indexOf(tam)] || 0;
const totalEstoque = p => Object.values(p.estoque).flat().reduce((a, b) => a + b, 0);
const precoPix = v => v * (1 - LOJA.descontoPix / 100);
function toast(m){ const t = $('#toast'); t.textContent = m; t.className = 'show'; clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', 2600); }

/* ===== montagem fixa ===== */
document.title = LOJA.demo ? `${LOJA.nome} — loja de demonstração` : LOJA.nome;
$('#marca').textContent = LOJA.nome;
if (LOJA.demo) { $('#demo').hidden = false; $('#demo-link').href = LOJA.demoLink; }
$('#zap').href = `https://wa.me/${LOJA.demo ? LOJA.demoWhats : LOJA.whats}?text=${encodeURIComponent(LOJA.demo ? 'Olá! Vi a loja de demonstração e quero uma loja assim para a minha marca.' : `Olá, ${LOJA.nome}! Vim pelo site.`)}`;
const D = LOJA.destaque;
$('#hero').innerHTML = `${peca('vestido', '#b5573a')}<small>${esc(D.selo)}</small><h1 class="serif">${esc(D.titulo)}</h1><p>${esc(D.texto)}</p><button data-act="novidades">${esc(D.botao)}</button>`;
$('#benef').innerHTML = LOJA.beneficios.map(b => `<span>${esc(b)}</span>`).join('');
$('#rodape').innerHTML = `<span class="marca serif">${esc(LOJA.nome)}</span>${esc(LOJA.slogan)}<br>${esc(LOJA.cidade)}
  <p style="margin-top:10px">${LOJA.instagram ? `<a href="https://instagram.com/${esc(LOJA.instagram)}" target="_blank" rel="noopener">@${esc(LOJA.instagram)}</a> · ` : ''}<a href="${$('#zap').href}" target="_blank" rel="noopener">WhatsApp</a></p>
  <p class="credito">Loja criada pela <a href="${esc(LOJA.demoLink)}">Dev Marketing</a></p>`;

/* ===== vitrine ===== */
function renderFiltros(){
  const usadas = [...new Set(PRODUTOS.map(p => p.cat))];
  const itens = [['todos','Todos'], ['novos','Novidades'], ...usadas.map(c => [c, CATEGORIAS[c] || c])];
  $('#filtros').innerHTML = itens.map(([k, v]) => `<button class="chip" data-act="cat" data-c="${k}" aria-pressed="${S.cat === k}">${v}</button>`).join('');
}
function renderGrade(){
  const q = S.busca.trim().toLowerCase();
  let lista = PRODUTOS.filter(p =>
    (S.cat === 'todos' || (S.cat === 'novos' ? p.novo : p.cat === S.cat)) &&
    (!q || (p.nome + ' ' + (CATEGORIAS[p.cat] || '') + ' ' + p.cores.map(c => c[0]).join(' ')).toLowerCase().includes(q)));
  if (S.ordem === 'menor') lista = [...lista].sort((a, b) => a.preco - b.preco);
  if (S.ordem === 'maior') lista = [...lista].sort((a, b) => b.preco - a.preco);
  if (S.ordem === 'novo') lista = [...lista].sort((a, b) => (b.novo ? 1 : 0) - (a.novo ? 1 : 0));
  $('#qtd-res').textContent = `${lista.length} ${lista.length === 1 ? 'peça' : 'peças'}`;
  $('#grade').innerHTML = lista.length ? lista.map(p => {
    const esg = totalEstoque(p) === 0, c = p.cores[0][1];
    return `<button class="prod" data-act="ver" data-id="${p.id}">
      <div class="foto" style="background:${tom(c, .82)}">${peca(p.tipo, c)}${esg ? '<span class="selo esg">Esgotado</span>' : p.novo ? '<span class="selo">Novo</span>' : ''}</div>
      <div class="info"><div class="n">${esc(p.nome)}</div><div class="p">${brl(p.preco)}</div>
        ${LOJA.descontoPix ? `<div class="px">${brl(precoPix(p.preco))} no Pix</div>` : ''}
        <div class="bolinhas">${p.cores.map(([n, h]) => `<i style="background:${h}" title="${esc(n)}"></i>`).join('')}</div></div>
    </button>`;
  }).join('') : '<p class="vazio" style="grid-column:1/-1">Nenhuma peça encontrada. Tente outra busca.</p>';
}
function renderCnt(pula){
  const n = S.sacola.reduce((s, i) => s + i.q, 0), c = $('#cnt');
  c.hidden = !n; c.textContent = n;
  if (pula) { c.classList.remove('pula'); void c.offsetWidth; c.classList.add('pula'); }
}

/* ===== janelas (o botão voltar fecha) ===== */
function abrir(titulo, html, hash){
  $('#sh-t').textContent = titulo;
  $('#sh-c').innerHTML = html;
  if ($('#sheet').hidden) {
    $('#sheet').hidden = false;
    document.body.style.overflow = 'hidden';
    history.pushState({ sheet:true }, '', hash);
  } else history.replaceState({ sheet:true }, '', hash);
  $('#sheet .sheet-box').scrollTop = 0;
}
function esconder(){ $('#sheet').hidden = true; $('#sh-c').innerHTML = ''; document.body.style.overflow = ''; }
function fechar(){ if (history.state?.sheet) history.back(); else { esconder(); history.replaceState(null, '', location.pathname); } }
addEventListener('popstate', () => { if (!$('#sheet').hidden) esconder(); });

/* ===== produto ===== */
function verProduto(p){
  const cor = p.cores.find(([n]) => p.tams.some(t => estoqueDe(p, n, t) > 0))?.[0] || p.cores[0][0];
  S.sel = { id:p.id, cor, tam:null, q:1 };
  abrir(CATEGORIAS[p.cat] || 'Produto', htmlProduto(p), '#produto-' + p.id);
}
function htmlProduto(p){
  const s = S.sel, hex = p.cores.find(c => c[0] === s.cor)[1], m = MEDIDAS[p.medida];
  const est = s.tam ? estoqueDe(p, s.cor, s.tam) : 0;
  const parcela = LOJA.parcelas > 1 ? ` ou ${LOJA.parcelas}x de ${brl(p.preco / LOJA.parcelas)} sem juros` : '';
  return `
    <div class="det-foto" style="background:${tom(hex, .8)}">${peca(p.tipo, hex)}<button class="compart" data-act="compartilhar" data-id="${p.id}">Compartilhar</button></div>
    <div class="det">
      <h3 class="serif">${esc(p.nome)}</h3>
      <div class="preco">${brl(p.preco)}${LOJA.descontoPix ? `<small>${brl(precoPix(p.preco))} no Pix${esc(parcela)}</small>` : ''}</div>
      <p class="desc">${esc(p.desc)}</p>
      <div class="rot">Cor <span>${esc(s.cor)}</span></div>
      <div class="cores">${p.cores.map(([n, h]) => `<button class="cor" style="background:${h}" data-act="cor" data-v="${esc(n)}" aria-label="${esc(n)}" aria-pressed="${n === s.cor}"></button>`).join('')}</div>
      <div class="rot">Tamanho <button class="link" data-act="medidas">Guia de medidas</button></div>
      <div class="tams">${p.tams.map(t => `<button class="tam" data-act="tam" data-v="${t}" aria-pressed="${t === s.tam}" ${estoqueDe(p, s.cor, t) ? '' : 'disabled aria-label="' + t + ' esgotado"'}>${t}</button>`).join('')}</div>
      <table class="medidas" id="medidas" hidden><tr>${m.cab.map(c => `<th>${c}</th>`).join('')}</tr>${m.lin.map(l => `<tr>${l.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table>
      <p class="aviso-est">${!p.tams.some(t => estoqueDe(p, s.cor, t)) ? 'Esta cor está esgotada.' : s.tam && est <= 2 ? `Últimas ${est} ${est === 1 ? 'unidade' : 'unidades'} neste tamanho` : ''}</p>
      <div class="acoes" style="margin-top:6px">
        <div class="qtd"><button data-act="menos" aria-label="Diminuir">−</button><b>${s.q}</b><button data-act="mais" aria-label="Aumentar">+</button></div>
        <button class="btn" data-act="adicionar">Adicionar à sacola</button>
      </div>
      <div class="acoes" style="margin-top:10px"><button class="btn claro" data-act="comprar-ja">Comprar agora</button></div>
    </div>`;
}
function atualizarProduto(){ const box = $('#sheet .sheet-box'), y = box.scrollTop; $('#sh-c').innerHTML = htmlProduto(prod(S.sel.id)); box.scrollTop = y; }

function adicionar(){
  const p = prod(S.sel.id), s = S.sel;
  if (!s.tam) { toast('Escolha o tamanho'); document.querySelector('.tams')?.scrollIntoView({ block:'center', behavior:'smooth' }); return false; }
  const est = estoqueDe(p, s.cor, s.tam);
  const item = S.sacola.find(i => i.id === p.id && i.cor === s.cor && i.tam === s.tam);
  const ja = item ? item.q : 0;
  if (ja + s.q > est) { toast(`Só temos ${est} em estoque nesse tamanho${ja ? ` (${ja} já na sacola)` : ''}`); return false; }
  if (item) item.q += s.q; else S.sacola.push({ id:p.id, cor:s.cor, tam:s.tam, q:s.q });
  guardar(); renderCnt(true);
  return true;
}

/* ===== sacola ===== */
function totais(){
  const sub = S.sacola.reduce((s, i) => s + prod(i.id).preco * i.q, 0);
  return { sub, pix: precoPix(sub) };
}
function verSacola(){ abrir('Sua sacola', htmlSacola(), '#sacola'); }
function htmlSacola(){
  S.sacola = S.sacola.filter(i => prod(i.id));
  if (!S.sacola.length) return `<p class="vazio">Sua sacola está vazia.</p><div class="pad"><button class="btn" data-act="fechar">Ver peças</button></div>`;
  const t = totais();
  return `
    ${S.sacola.map((i, k) => { const p = prod(i.id), hex = p.cores.find(c => c[0] === i.cor)?.[1] || p.cores[0][1];
      return `<div class="it"><div class="mini" style="background:${tom(hex, .8)}">${peca(p.tipo, hex)}</div>
        <div class="meio"><div class="n">${esc(p.nome)}</div><div class="v">${esc(i.cor)} · Tam. ${esc(i.tam)}</div>
          <div class="lin"><div class="qtd"><button data-act="it-menos" data-k="${k}" aria-label="Diminuir">−</button><b>${i.q}</b><button data-act="it-mais" data-k="${k}" aria-label="Aumentar">+</button></div>
          <b>${brl(p.preco * i.q)}</b></div>
          <button class="rm" data-act="it-rm" data-k="${k}">Remover</button></div></div>`; }).join('')}
    <div class="tot"><div><span>Subtotal</span><span>${brl(t.sub)}</span></div>
      ${LOJA.descontoPix ? `<div class="pix"><span>No Pix (${LOJA.descontoPix}% off)</span><span>${brl(t.pix)}</span></div>` : ''}
      <div><span>Frete</span><span>combinado no WhatsApp</span></div>
      <div class="g"><span>Total</span><span>${brl(t.sub)}</span></div></div>
    <form class="form" id="f-pedido" novalidate>
      <label class="f"><span>Seu nome</span><input name="nome" autocomplete="name" required maxlength="80"></label>
      <label class="f"><span>Cidade e estado</span><input name="cidade" autocomplete="address-level2" placeholder="Ex.: Campinas/SP" required maxlength="80"></label>
      <div class="f"><span>Entrega</span><div class="opc" style="grid-template-columns:1fr 1fr">
        <label><input type="radio" name="entrega" value="Envio pelos Correios/transportadora" checked><span>Receber em casa</span></label>
        <label><input type="radio" name="entrega" value="Retirar na loja"><span>Retirar na loja</span></label></div></div>
      <div class="f"><span>Pagamento</span><div class="opc">
        <label><input type="radio" name="pag" value="Pix" checked><span>Pix${LOJA.descontoPix ? `<br>−${LOJA.descontoPix}%` : ''}</span></label>
        <label><input type="radio" name="pag" value="Cartão"><span>Cartão</span></label>
        <label><input type="radio" name="pag" value="Combinar"><span>Combinar</span></label></div></div>
      <p class="erro" id="erro-ped" role="alert" style="margin-left:0"></p>
      <button class="btn verde" type="submit" style="width:100%;margin-top:4px">Enviar pedido pelo WhatsApp</button>
    </form>`;
}
function mensagem(dados){
  const t = totais(), cod = 'PED-' + Date.now().toString(36).slice(-5).toUpperCase();
  const pix = dados.pag === 'Pix' && LOJA.descontoPix;
  return [
    `Olá! Quero fazer este pedido na *${LOJA.nome}* (${cod}):`, '',
    ...S.sacola.map(i => { const p = prod(i.id); return `• ${i.q}x ${p.nome} — ${i.cor}, ${i.tam} — ${brl(p.preco * i.q)}`; }), '',
    `Subtotal: ${brl(t.sub)}`,
    `Pagamento: ${dados.pag}${pix ? ` (${LOJA.descontoPix}% off) — *${brl(t.pix)}*` : ''}`,
    `Entrega: ${dados.entrega} — ${dados.cidade} (frete a combinar)`, '',
    `Nome: ${dados.nome}`
  ].join('\n');
}
function enviarPedido(f){
  const d = Object.fromEntries(new FormData(f));
  d.nome = (d.nome || '').trim(); d.cidade = (d.cidade || '').trim();
  const erro = $('#erro-ped');
  if (!d.nome || !d.cidade) { erro.textContent = 'Preencha seu nome e sua cidade.'; return; }
  for (const i of S.sacola) {
    const p = prod(i.id), est = estoqueDe(p, i.cor, i.tam);
    if (i.q > est) { erro.textContent = `${p.nome} (${i.cor}, ${i.tam}): só temos ${est} em estoque.`; return; }
  }
  const msg = mensagem(d);
  if (!LOJA.demo) { window.open(`https://wa.me/${LOJA.whats}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener'); return; }
  abrir('Pedido pronto!', `
    <p class="explica">Na loja de verdade, ao tocar em enviar, <b>esta mensagem chega no WhatsApp da lojista</b>, já com peça, cor, tamanho, total e forma de pagamento. Sem perguntas repetidas no direct.</p>
    <div class="zapbg"><div class="balao">${esc(msg).replace(/\*([^*]+)\*/g, '<b>$1</b>')}</div></div>
    <div class="pad" style="margin-top:16px;display:grid;gap:10px">
      <a class="btn ac" href="${esc(LOJA.demoLink)}">Quero uma loja assim</a>
      <a class="btn verde" href="https://wa.me/${LOJA.demoWhats}?text=${encodeURIComponent('Olá! Testei a loja de demonstração e quero uma assim para a minha marca.')}" target="_blank" rel="noopener">Falar com a Dev Marketing</a>
      <button class="btn claro" data-act="limpar-demo">Voltar à loja</button>
    </div>`, '#pedido');
}

/* ===== eventos ===== */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'ver') verProduto(prod(el.dataset.id));
  else if (a === 'fechar') fechar();
  else if (a === 'sacola') verSacola();
  else if (a === 'buscar') { const b = $('#busca-box'); b.hidden = !b.hidden; if (!b.hidden) $('#busca').focus(); }
  else if (a === 'cat') { S.cat = el.dataset.c; renderFiltros(); renderGrade(); }
  else if (a === 'novidades') { S.cat = 'novos'; renderFiltros(); renderGrade(); $('#filtros').scrollIntoView({ behavior:'smooth' }); }
  else if (a === 'cor') { S.sel.cor = el.dataset.v; if (S.sel.tam && !estoqueDe(prod(S.sel.id), S.sel.cor, S.sel.tam)) S.sel.tam = null; S.sel.q = 1; atualizarProduto(); }
  else if (a === 'tam') { S.sel.tam = el.dataset.v; S.sel.q = 1; atualizarProduto(); }
  else if (a === 'medidas') { const t = $('#medidas'); t.hidden = !t.hidden; }
  else if (a === 'mais') { const p = prod(S.sel.id), max = S.sel.tam ? estoqueDe(p, S.sel.cor, S.sel.tam) : 9; if (S.sel.q < max) S.sel.q++; else toast('Quantidade máxima em estoque'); atualizarProduto(); }
  else if (a === 'menos') { if (S.sel.q > 1) S.sel.q--; atualizarProduto(); }
  else if (a === 'adicionar') { if (adicionar()) { toast('Adicionado à sacola'); fechar(); } }
  else if (a === 'comprar-ja') { if (adicionar()) verSacola(); }
  else if (a === 'compartilhar') {
    const p = prod(el.dataset.id), url = location.origin + location.pathname + '#produto-' + p.id;
    try { if (navigator.share) await navigator.share({ title:p.nome, text:`${p.nome} — ${LOJA.nome}`, url }); else { await navigator.clipboard.writeText(url); toast('Link copiado'); } } catch(err){}
  }
  else if (a === 'it-mais' || a === 'it-menos' || a === 'it-rm') {
    const i = S.sacola[el.dataset.k]; if (!i) return;
    if (a === 'it-rm') S.sacola.splice(el.dataset.k, 1);
    else if (a === 'it-menos') { i.q--; if (i.q < 1) S.sacola.splice(el.dataset.k, 1); }
    else { if (i.q < estoqueDe(prod(i.id), i.cor, i.tam)) i.q++; else toast('Quantidade máxima em estoque'); }
    guardar(); renderCnt(); $('#sh-c').innerHTML = htmlSacola();
  }
  else if (a === 'limpar-demo') { S.sacola = []; guardar(); renderCnt(); fechar(); }
});
document.addEventListener('submit', e => { if (e.target.id === 'f-pedido') { e.preventDefault(); enviarPedido(e.target); } });
$('#busca').addEventListener('input', e => { S.busca = e.target.value; renderGrade(); });
$('#ordem').addEventListener('change', e => { S.ordem = e.target.value; renderGrade(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) fechar(); });

renderFiltros(); renderGrade(); renderCnt();
// link direto para um produto (#produto-3) ou para a sacola
function abrirPeloHash(){
  const h = location.hash;
  if (!$('#sheet').hidden) return;
  if (/^#produto-\d+$/.test(h) && prod(h.slice(9))) { history.replaceState(null, '', location.pathname); verProduto(prod(h.slice(9))); }
  else if (h === '#sacola') { history.replaceState(null, '', location.pathname); verSacola(); }
}
abrirPeloHash();
addEventListener('hashchange', abrirPeloHash);
</script>
</body>
